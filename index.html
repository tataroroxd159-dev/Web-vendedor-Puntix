<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="css/base.css">
<title>Inicia sesión · Puntix vendedor</title>
</head>
<body class="pagina-auth">
  <p class="marca">Puntix</p>
  <p class="lema">Panel del vendedor</p>
  <main class="contenedor">
    <h1>Inicia sesión</h1>
    <div id="alerta" hidden></div>
    <form id="formulario" novalidate>
      <div class="campo">
        <label for="email">Correo</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn" id="enviar" type="submit">Entrar</button>
    </form>
    <div class="enlaces">
      <a href="olvide-contrasena.html">Olvidé mi contraseña</a>
    </div>
  </main>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/login.js"></script>
</body>
</html>
